<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--g1:#00703c;--g2:#005c30;--g3:#003d22;--gold:#c8a84b;--bg:#f2f8f4;--card:#fff;--border:#d0e8d8;--text:#182818;--dim:#7a9a7a}body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);direction:rtl;-webkit-tap-highlight-color:transparent}.topbar{background:var(--g2);color:rgba(255,255,255,.8);padding:6px 18px;font-size:11px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.topbar strong{color:#fff}.header{background:#fff;border-bottom:3px solid var(--g1);padding:13px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 14px rgba(0,112,60,.1)}.hlogo{display:flex;align-items:center;gap:12px}.himg{width:50px;height:50px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);flex-shrink:0}.htext .org{font-size:10px;color:var(--g1);font-weight:700}.htext .name{font-size:18px;font-weight:900;color:var(--text)}.htext .sub{font-size:11px;color:var(--dim)}.hbadge{background:#e8f5e9;border:1.5px solid var(--g1);border-radius:10px;padding:7px 16px;font-size:13px;font-weight:700;color:var(--g1);white-space:nowrap}.day-tabs-wrap{background:#fff;border-bottom:1px solid var(--border);padding:12px 16px 0;overflow-x:auto;scrollbar-width:none;position:sticky;top:79px;z-index:99}.day-tabs-wrap::-webkit-scrollbar{display:none}.day-tabs{display:flex;gap:7px;min-width:max-content}.day-btn{background:#fff;border:1.5px solid var(--border);border-bottom:none;border-radius:10px 10px 0 0;padding:8px 14px 10px;cursor:pointer;color:var(--dim);font-family:'Cairo',sans-serif;text-align:center;transition:all .18s;white-space:nowrap}.day-btn:hover{border-color:var(--g1);color:var(--g1)}.day-btn.active{background:var(--g1);border-color:var(--g1);color:#fff;font-weight:700}.db-date{font-size:10px;opacity:.8;display:block}.db-name{font-size:13px;font-weight:800}.shift-bar{backgrou ansition:transform .15s}.card:active{transform:scale(.98)}.card-h{padding:10px 13px;display:flex;align-items:center;justify-content:space-between}.card-title{font-size:13px;font-weight:800;color:#fff}.card-cnt{font-size:10px;font-weight:700;background:rgba(255,255,255,.22);color:#fff;border-radius:20px;padding:2px 8px}.card-b{padding:9px 11px;display:flex;flex-direction:column;gap:7px}.doc-row{display:flex;align-items:center;justify-content:space-between;background:#f8fdf9;border:1px solid #e4efe4;border-radius:9px;padding:8px 11px}.doc-l{display:flex;align-items:center;gap:8px}.doc-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}.doc-name{font-size:12px;font-weight:700;color:var(--text)}.doc-fl{font-size:10px;color:var(--dim);margin-top:1px}.tag{font-size:11px;font-weight:800;border-radius:7px;padding:3px 9px;white-space:nowrap}.tag-am{color:#92400e;background:#fef3c7}.tag-pm{color:#3730a3;background:#ede9fe}.empty{padding:50px 20px;text-align:center;color:var(--dim);font-size:14px}footer{background:var(--g3);color:rgba(255,255,255,.75);padding:22px 20px;text-align:center}.ft-phone{display:inline-flex;align-items:center;gap:8px;background:var(--gold);color:var(--g3);border-radius:30px;padding:10px 26px;font-size:17px;font-weight:900;margin-bottom:12px;text-decoration:none}.ft-name{font-size:13px;color:#fff;font-weight:700;margin-bottom:4px}.ft-sub{font-size:11px}.fab{position:fixed;left:14px;bottom:14px;display:flex;align-items:center;gap:7px;background:var(--gold);color:var(--g3);border:none;border-radius:30px;padding:12px 20px;font-family:'Cairo',sans-serif;font-size:15px;font-weight:900;cursor:pointer;z-index:300;text-decoration:none;animation:pulse 2.5s infinite}@keyframes pulse{0%,100%{box-shadow:0 6px 24px rgba(200,168,75,.45)}50%{box-shadow:0 6px 36px rgba(200,168,75,.7)}}.scroll-top{position:fixed;left:14px;bottom:70px;width:42px;height:42px;border-radius:50%;background:var(--g1
